name = "railglance-telemetry"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[r2_buckets]]
binding = "TELEMETRY_BUCKET"
bucket_name = "railglance-telemetry-bucket"

[[durable_objects.bindings]]
name = "CAMPAIGN_QUALIFICATIONS"
class_name = "CampaignQualification"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CampaignQualification"]

[[ratelimits]]
name = "TELEMETRY_ENROLL_RATE_LIMITER"
namespace_id = "24001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "TELEMETRY_PARTICIPANT_RATE_LIMITER"
namespace_id = "24002"

  [ratelimits.simple]
  limit = 240
  period = 60

[[queues.producers]]
binding = "TELEMETRY_QUEUE"
queue = "railglance-telemetry"

[[queues.consumers]]
queue = "railglance-telemetry"
max_batch_size = 10
max_batch_timeout = 10
max_retries = 5
dead_letter_queue = "railglance-telemetry-dlq"

[vars]
# Local Vite plus Even App WebView origins. The WebView is served by a loopback
# HTTP server on an OS-assigned ephemeral port, so host is stable but the port is not.
TELEMETRY_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:*,http://localhost:*"
TELEMETRY_CAMPAIGN_ID = "railglance-beta-2026"
TELEMETRY_QUALIFICATION_DAYS = "14"
TELEMETRY_ALLOWED_RELEASES = "railglance@0.1.0,railglance@0.1.1,railglance@0.1.2,railglance@0.1.3"
TELEMETRY_TOKEN_TTL_SECONDS = "900"

# Set with `wrangler secret put`; never place either value in this file or the .ehpk.
# TELEMETRY_DIAGNOSTIC_ACCESS_CODE
# TELEMETRY_TOKEN_SIGNING_SECRET
# TELEMETRY_ADMIN_TOKEN
