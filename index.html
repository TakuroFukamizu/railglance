<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RailGlance - Even G2 Train HUD</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>RailGlance - Even G2 HUD</h1>
        <div class="controls">
          <button id="btn-start" class="btn btn-primary">実機GPS開始</button>
          <button id="btn-stop" class="btn">停止</button>
          <button id="btn-request-motion" class="btn btn-secondary">モーションセンサー有効化</button>
          <button id="btn-replay-odakyu" class="btn btn-secondary">小田急線デモ</button>
          <button id="btn-replay-shinkansen" class="btn btn-secondary">新幹線デモ</button>
        </div>
      </header>

      <main class="app-main">
        <section class="preview-section">
          <h2>Even G2 グラス視界プレビュー (576×288px ハイブリッド表示 / PNG画像速度＋ネイティブTextContainer)</h2>
          <div class="glasses-viewport">
            <div id="hud-root" class="hud-root">
              <!-- Y: 0~44 -> HEADER TextContainer (ID 1) -->
              <div class="hud-header">
                <span id="hud-line-name" class="hud-line-name brightness-secondary">小田急小田原線</span>
                <span id="hud-service" class="hud-service brightness-secondary">上り</span>
              </div>

              <!-- Y: 48~192 -> SPEED ImageContainer (ID 2, X: 144, W: 288, H: 144) -->
              <div class="hud-speed-container">
                <span id="hud-speed-val" class="speed-value brightness-primary">--</span>
                <span class="speed-unit brightness-tertiary">km/h</span>
                <span id="hud-speed-est" class="speed-estimated brightness-tertiary">~</span>
              </div>

              <!-- Y: 196~244 -> SEGMENT TextContainer (ID 3) -->
              <div class="hud-segment-container">
                <div class="hud-station-row">
                  <span id="hud-prev-station" class="station-prev brightness-secondary">海老名</span>
                  <span id="hud-progress-text" class="progress-text brightness-secondary">━━━●━━━━━</span>
                  <span id="hud-next-station" class="station-next brightness-primary">座間</span>
                </div>
              </div>

              <!-- Y: 248~288 -> FOOTER TextContainer (ID 4) -->
              <div class="hud-footer">
                <span id="hud-dist-next" class="footer-left brightness-tertiary">次まで 4.2km</span>
                <span id="hud-footer-right" class="footer-right brightness-tertiary">GPS</span>
              </div>
            </div>
          </div>
        </section>

        <section class="debug-section">
          <h2>マルチソース速度推定 & NavigationState デバッグパネル</h2>
          <div id="debug-panel"></div>
        </section>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
