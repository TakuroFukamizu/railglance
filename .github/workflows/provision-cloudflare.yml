name: Provision Cloudflare Infrastructure

on:
  pull_request:
    paths:
      - 'infra/cloudflare/terraform/**'
      - '.github/workflows/provision-cloudflare.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Run a read-only plan or apply the reviewed changes
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: cloudflare-terraform
  cancel-in-progress: false

env:
  TERRAFORM_VERSION: 1.14.3
  TERRAFORM_DIR: infra/cloudflare/terraform

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Check Formatting
        run: terraform -chdir="$TERRAFORM_DIR" fmt -check -diff

      - name: Initialize without Remote State
        run: terraform -chdir="$TERRAFORM_DIR" init -backend=false -input=false

      - name: Validate Configuration
        run: terraform -chdir="$TERRAFORM_DIR" validate

  provision:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_ENDPOINT_URL_S3: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TF_VAR_account_id: ${{ secrets.R2_ACCOUNT_ID }}
      TF_VAR_r2_access_key_id: ${{ secrets.R2_ACCESS_KEY_ID }}
      TF_VAR_r2_secret_access_key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      TF_VAR_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME || 'railglance-dataset-bucket' }}
      R2_CORS_ALLOWED_ORIGINS: ${{ vars.R2_CORS_ALLOWED_ORIGINS }}
      TF_STATE_BUCKET_NAME: ${{ vars.TF_STATE_BUCKET_NAME || 'railglance-terraform-state' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Validate Repository Configuration
        shell: bash
        run: |
          set -euo pipefail

          required_variables=(
            CLOUDFLARE_API_TOKEN
            R2_ACCOUNT_ID
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            R2_CORS_ALLOWED_ORIGINS
          )
          missing_variables=()

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              missing_variables+=("$variable_name")
            fi
          done

          if (( ${#missing_variables[@]} > 0 )); then
            printf 'Missing required GitHub Actions configuration: %s\n' "${missing_variables[*]}" >&2
            exit 1
          fi

          if [[ ! "$R2_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo 'R2_ACCOUNT_ID must be the 32-character Cloudflare Account ID from Account home; do not use a Zone ID or R2 token ID.' >&2
            exit 1
          fi

          if [[ ! "$TF_STATE_BUCKET_NAME" =~ ^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])?$ ]]; then
            echo 'TF_STATE_BUCKET_NAME must be a valid 3-63 character R2 bucket name.' >&2
            exit 1
          fi

          origins_json="$(
            jq -cn --arg origins "$R2_CORS_ALLOWED_ORIGINS" \
              '$origins | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'
          )"

          if [[ "$(jq 'length' <<<"$origins_json")" -eq 0 ]]; then
            echo 'R2_CORS_ALLOWED_ORIGINS must contain at least one exact origin.' >&2
            exit 1
          fi

          {
            echo "TF_VAR_dataset_bucket_name=$R2_BUCKET_NAME"
            echo "TF_VAR_cors_allowed_origins=$origins_json"
          } >> "$GITHUB_ENV"

      - name: Bootstrap Terraform State Bucket
        shell: bash
        run: |
          set -euo pipefail

          bucket_url="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets/${TF_STATE_BUCKET_NAME}"
          response_file="$RUNNER_TEMP/r2-state-bucket-response.json"
          http_status="$(
            curl --disable --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "$bucket_url"
          )"

          case "$http_status" in
            200)
              echo "Terraform state bucket already exists: $TF_STATE_BUCKET_NAME"
              ;;
            404)
              create_payload="$(jq -cn --arg name "$TF_STATE_BUCKET_NAME" '{name: $name, locationHint: "apac"}')"
              create_response="$RUNNER_TEMP/r2-state-bucket-create.json"
              create_status="$(
                curl --disable --silent --show-error \
                  --request POST \
                  --output "$create_response" \
                  --write-out '%{http_code}' \
                  --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  --header 'Content-Type: application/json' \
                  --data "$create_payload" \
                  "https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets"
              )"

              if [[ "$create_status" == 200 || "$create_status" == 201 ]]; then
                echo "Created Terraform state bucket: $TF_STATE_BUCKET_NAME"
              else
                echo "Unable to create Terraform state bucket (HTTP $create_status)." >&2
                jq -r '.errors[]?.message' "$create_response" >&2 || true
                exit 1
              fi
              ;;
            *)
              echo "Unable to inspect Terraform state bucket (HTTP $http_status)." >&2
              jq -r '.errors[]?.message' "$response_file" >&2 || true
              exit 1
              ;;
          esac

      - name: Initialize Remote State
        run: >-
          terraform -chdir="$TERRAFORM_DIR" init -reconfigure -input=false
          -backend-config="bucket=$TF_STATE_BUCKET_NAME"

      - name: Adopt Existing R2 Infrastructure
        shell: bash
        run: |
          set -euo pipefail

          api_root="https://api.cloudflare.com/client/v4/accounts/${R2_ACCOUNT_ID}/r2/buckets"

          state_contains() {
            terraform -chdir="$TERRAFORM_DIR" state show "$1" > /dev/null 2>&1
          }

          inspect_bucket() {
            local bucket_name="$1"
            local response_file="$2"

            curl --disable --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "${api_root}/${bucket_name}"
          }

          adopt_bucket() {
            local resource_address="$1"
            local bucket_name="$2"
            local response_file="$RUNNER_TEMP/${bucket_name}-bucket.json"
            local http_status

            if state_contains "$resource_address"; then
              echo "Already managed: $resource_address"
              return
            fi

            http_status="$(inspect_bucket "$bucket_name" "$response_file")"
            case "$http_status" in
              200)
                terraform -chdir="$TERRAFORM_DIR" import -input=false \
                  "$resource_address" "${R2_ACCOUNT_ID}/${bucket_name}"
                echo "Imported existing bucket: $bucket_name"
                ;;
              404)
                echo "Bucket will be created by Terraform: $bucket_name"
                ;;
              *)
                echo "Unable to inspect R2 bucket $bucket_name (HTTP $http_status)." >&2
                jq -r '.errors[]?.message' "$response_file" >&2 || true
                exit 1
                ;;
            esac
          }

          adopt_bucket cloudflare_r2_bucket.railway_dataset "$R2_BUCKET_NAME"
          adopt_bucket cloudflare_r2_bucket.diagnostic_telemetry railglance-telemetry-bucket

          if ! state_contains aws_s3_bucket_cors_configuration.railway_dataset; then
            cors_response="$RUNNER_TEMP/${R2_BUCKET_NAME}-cors.json"
            cors_status="$(
              curl --disable --silent --show-error \
                --output "$cors_response" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                "${api_root}/${R2_BUCKET_NAME}/cors"
            )"

            if [[ "$cors_status" == 200 ]] && [[ "$(jq '.result.rules | length' "$cors_response")" -gt 0 ]]; then
              terraform -chdir="$TERRAFORM_DIR" import -input=false \
                aws_s3_bucket_cors_configuration.railway_dataset "$R2_BUCKET_NAME"
              echo "Imported existing CORS configuration: $R2_BUCKET_NAME"
            elif [[ "$cors_status" == 200 || "$cors_status" == 404 ]]; then
              echo "CORS configuration will be created by Terraform: $R2_BUCKET_NAME"
            else
              echo "Unable to inspect R2 CORS configuration (HTTP $cors_status)." >&2
              jq -r '.errors[]?.message' "$cors_response" >&2 || true
              exit 1
            fi
          fi

      - name: Plan Infrastructure
        run: terraform -chdir="$TERRAFORM_DIR" plan -input=false -out="$RUNNER_TEMP/cloudflare.tfplan"

      - name: Apply Infrastructure
        if: inputs.operation == 'apply'
        run: terraform -chdir="$TERRAFORM_DIR" apply -input=false -auto-approve "$RUNNER_TEMP/cloudflare.tfplan"
